history_days: 30
target_lead_hours: [6, 12, 24, 48, 72]
resample_rule: "1h"   # or "3h"

numeric:
  lightgbm:
    n_estimators: 400
    learning_rate: 0.05
    num_leaves: 63
    random_state: 42
  patchtst:
    input_size: 168
    h: 24
    max_steps: 50   # increase for production

llm:
  instruction: "判断该波浪浮标窗口的海况节律类型、未来24小时可预测性等级，并给出依据。"
  max_windows_per_station: 200
  predictability_lead_h: 24
  predictability_pred_path: "data/processed/predictions/test_predictions_lgbm.parquet"

# Amazon Chronos (Hugging Face pretrained time-series foundation model) — optional numeric forecast line.
chronos:
  model_id: "amazon/chronos-t5-tiny"
  context_length: 256
  num_samples: 12
  max_unique_issues_per_station: 36

figures:
  forecast_lead_h: 24

# Official Mistral + LoRA (HF). 本地已下载权重时设置 local_model_path，无需 HF_TOKEN。
lora:
  base_model_id: "mistralai/Mistral-7B-Instruct-v0.3"
  # 项目内默认路径（运行 scripts/00_download_mistral_weights.py 后可用）
  local_model_path: "models/mistral/Mistral-7B-Instruct-v0.3"
  local_files_only: true
  output_dir: "data/processed/mistral/lora_run"
  # bitsandbytes 4bit 在 Windows 上通常不可用；4090 24GB 可用 fp16 全量 + LoRA
  use_4bit: false
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  max_seq_length: 1024
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0002
  num_epochs: 1
  max_steps: 0
  fp16: true
  max_train_samples: 0
  max_val_samples: 0
  max_eval_samples: 24
  val_frac: 0.1
  test_frac: 0.1
  split_seed: 42

# LLM zero-shot on JSONL — default Ollama (local); set backend: hf for Hugging Face Mistral.
mistral_infer:
  backend: ollama
  ollama_model: "deepseek-r1:14b"
  model_id: "mistralai/Mistral-7B-Instruct-v0.3"
  max_samples: 6
  max_new_tokens: 320
  temperature: 0.1

# Mistral JSON curve forecast (hs_forecast_m arrays) — separate LoRA from classification task.
# v2: compact JSONL (Hs history + Tp/wind mean/trend/last6) + grad checkpoint; curve_lora_run_v2 keeps pilot intact.
mistral_curve:
  history_hours: 168
  horizon_hours: 24
  dt_hours: 1
  stride_hours: 24
  train_frac: 0.8
  val_frac: 0.1
  split_seed: 42
  output_dir: "data/processed/mistral/curve_lora_run_v2"
  max_seq_length: 2048
  max_new_tokens: 400
  max_train_samples: 1024
  max_val_samples: 64
  max_eval_samples: 24
  max_steps: 200
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-5
  fp16: true
  temperature: 0.05
  do_sample: false
  gradient_checkpointing: true
  eval_during_training: false
  logging_steps: 1
  save_steps: 50
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

paths:
  raw: "data/raw"
  interim: "data/interim"
  processed: "data/processed"
